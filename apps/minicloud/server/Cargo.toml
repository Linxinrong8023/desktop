[package]
name = "ora-minicloud-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ora-controller.workspace = true
ora-contracts.workspace = true
ora-node-protocol.workspace = true
ora-logging.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "signal", "sync", "time", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
reqwest = { workspace = true, features = ["json"] }
